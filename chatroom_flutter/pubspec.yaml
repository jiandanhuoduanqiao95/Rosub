name: chatroom_flutter
description: "聊天室 Flutter 桌面客户端 —— Windows / Linux / Android 三端统一"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  dart_protocol:
    path: ../dart_protocol
  ffi: ^2.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
