name: chatroom_flutter
description: "聊天室 Flutter 桌面客户端 —— Windows / Linux / Android 三端统一"
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  dart_protocol:
    path: ../dart_protocol
  ffi: ^2.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  # 阶段 L2（P1-23）：密码改存系统钥匙串（flutter_secure_storage）
  flutter_secure_storage: ^9.2.2
  # 阶段 L3（P0-4）：客户端本地消息缓存（sqflite + 桌面/测试 FFI 后端）
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  # R-P14（用户实测崩溃）：1.1.x 的 native→Flutter 消息在非平台线程发送
  # （shell.cc ERROR + 可能崩溃），1.2.x/2.x 修复线程问题——升级并回归
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # R-P9（文件预览扩展）：docx/xlsx/pptx 为 ZIP+OOXML，archive 纯 Dart 解包
  # 提取文本预览（零原生依赖）
  archive: ^4.2.0
  # Q0-6（证书指纹校验）：SHA-256(cert.der) 指纹计算
  crypto: ^3.0.0
  # 阶段 R1（音视频通话）：libwebrtc 官方 Flutter 封装（五平台）
  flutter_webrtc: ^1.4.1
  # R1 真机排障（r1s6）：flutter_webrtc 的传递依赖，main() 转发 libwebrtc
  # 原生日志需要显式引用（定位 Android 闪退后可移除）
  logger: ^2.0.2

# 阶段 R1 真机三轮（r1s4）：Android 接听瞬间 SIGABRT 闪退，根因是
# 1.6.x Android 端 PeerConnectionObserver.onAddTrack 在信令线程调用
# m150 的 getTransceivers()（dispose-all 语义，双重释放即崩，上游
# issue #2162，无修复版本）——本地补丁副本见
# third_party/flutter_webrtc/README-PATCH.md；上游修复发布后移除。
dependency_overrides:
  flutter_webrtc:
    path: ../third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 测试重构新增：mocktail（无代码生成的 Mock 库，用于隔离网络服务的 widget 测试）
  mocktail: ^1.0.4
  # 测试强化新增：faker（生成随机用户名/文本/路径等数据，用于模糊/属性测试）
  faker: ^2.2.0
  # 阶段 R1：通话状态机定时器测试（45s 响铃超时 / 2s 结束复位虚拟时钟）
  fake_async: ^1.3.1
  # 测试重构新增：integration_test（Flutter 官方端到端测试绑定）
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # 彩色 emoji 字体（阶段 K：表情回应彩色渲染，Telegram 风格）
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

  # Rosub 品牌（gc12）：登录页 logo 与窗口图标（Linux runner 经
  # flutter_assets 路径加载 rosub_icon.png）
  assets:
    - assets/rosub_login_logo.png
    - assets/rosub_icon.png