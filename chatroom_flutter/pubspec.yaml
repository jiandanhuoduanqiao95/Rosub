name: chatroom_flutter
description: "聊天室 Flutter 桌面客户端 —— Windows / Linux / Android 三端统一"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  dart_protocol:
    path: ../dart_protocol
  ffi: ^2.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 测试重构新增：mocktail（无代码生成的 Mock 库，用于隔离网络服务的 widget 测试）
  mocktail: ^1.0.4
  # 测试强化新增：faker（生成随机用户名/文本/路径等数据，用于模糊/属性测试）
  faker: ^2.2.0
  # 测试重构新增：integration_test（Flutter 官方端到端测试绑定）
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true